services:

  backend:
    build: ./backend
    container_name: careerpilot-backend
    restart: always
    expose:
      - "8000"
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY}


  frontend:
    build: ./frontend
    container_name: careerpilot-frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "80:80"